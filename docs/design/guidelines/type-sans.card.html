<!-- @dsCard group="Type" viewport="700x230" name="Geist Sans — UI scale" subtitle="Display → heading → body → caption; sentence case, tight tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:22px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-fg)}
  .r{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--color-border)}
  .r:last-child{border-bottom:0}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--color-fg-subtle);width:150px;flex:none}
</style>
</head>
<body>
<div class="r"><span class="tag">4xl · 600 · tight</span><span style="font-size:var(--text-4xl);font-weight:600;letter-spacing:-.025em;line-height:1">Shorten every link</span></div>
<div class="r"><span class="tag">2xl · 600</span><span style="font-size:var(--text-2xl);font-weight:600;letter-spacing:-.025em">Analytics overview</span></div>
<div class="r"><span class="tag">lg · 600</span><span style="font-size:var(--text-lg);font-weight:600">Link settings</span></div>
<div class="r"><span class="tag">sm · 400 · DEFAULT</span><span style="font-size:var(--text-sm)">The product body default is 14px — the app is dense.</span></div>
<div class="r"><span class="tag">xs · 500 · UPPERCASE</span><span style="font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--color-fg-muted)">Total clicks</span></div>
</body>
</html>
