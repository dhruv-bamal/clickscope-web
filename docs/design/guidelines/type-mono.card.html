<!-- @dsCard group="Type" viewport="700x150" name="Geist Mono — machine text" subtitle="Every URL, alias, code, and QR payload — shown verbatim" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:22px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-fg)}
  .mono{font-family:var(--font-mono)}
  .r{display:flex;align-items:center;gap:12px;padding:5px 0}
  .lbl{font-size:11px;color:var(--color-fg-muted);width:120px;flex:none}
  .chip{background:var(--color-surface-subtle);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:4px 8px;font-size:13px}
</style>
</head>
<body>
<div class="r"><span class="lbl">Short URL</span><span class="mono" style="font-weight:500">short.link/launch</span></div>
<div class="r"><span class="lbl">Alias field</span><span class="mono chip">spring-2026</span></div>
<div class="r"><span class="lbl">Metrics</span><span class="mono cs-tnum" style="font-size:20px;font-weight:600">24,819</span><span style="font-size:11px;color:var(--color-fg-muted)">tabular-nums — columns align</span></div>
</body>
</html>
