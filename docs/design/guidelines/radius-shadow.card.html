<!-- @dsCard group="Spacing" viewport="700x170" name="Radius & elevation" subtitle="Bigger surface → bigger radius; flat = border, float = shadow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:22px;background:var(--color-canvas);font-family:var(--font-sans);color:var(--color-fg)}
  .grid{display:flex;gap:18px;align-items:flex-start}
  .box{background:var(--color-surface);border:1px solid var(--color-border);width:78px;height:60px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--color-fg-muted)}
  .u{display:flex;flex-direction:column;gap:7px;align-items:center}
  .u small{font-family:var(--font-mono);font-size:9px;color:var(--color-fg-subtle)}
  .sep{width:1px;align-self:stretch;background:var(--color-border);margin:0 4px}
</style>
</head>
<body>
<div class="grid">
  <div class="u"><div class="box" style="border-radius:var(--radius-md)">control</div><small>md · 6px</small></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-lg)">card</div><small>lg · 8px</small></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-xl)">modal</div><small>xl · 12px</small></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-full);width:60px;height:60px">pill</div><small>full</small></div>
  <div class="sep"></div>
  <div class="u"><div class="box" style="border:0;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)">sm</div><small>hover card</small></div>
  <div class="u"><div class="box" style="border:0;border-radius:var(--radius-lg);box-shadow:var(--shadow-md)">md</div><small>menu</small></div>
  <div class="u"><div class="box" style="border:0;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)">lg</div><small>modal</small></div>
</div>
<p style="margin:14px 0 0;font-size:11px;color:var(--color-fg-muted)">Flat surfaces use a 1px border, not a shadow. Shadow is reserved for things that genuinely float — menus, modals, toasts.</p>
</body>
</html>
