<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Click Scope — Marketing</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script src="../../_ds_bundle.js"></script>
<style>html,body,#root{height:100%}body{margin:0}</style>

<body>
<div id="root"></div>
<script type="text/babel" src="MarketingLanding.jsx"></script>
<script type="text/babel" src="../app/Overlays.jsx"></script>
<script type="text/babel">
function App() {
  const [view, setView] = React.useState("landing"); // landing | signin
  if (view === "signin") return <SignInScreen onSignIn={() => setView("landing")} />;
  return <MarketingLanding onSignIn={() => setView("signin")} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
